[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "lennoxs30ctl"
version = "0.1.0"
description = "CLI and TUI for Lennox S30/E30/M30 thermostats over the local API"
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.13"
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.13",
]
dependencies = [
    "lennoxs30api>=0.2.24",
]

[project.optional-dependencies]
tui = ["textual>=8.0.0"]
dev = [
    "ruff>=0.15.2",
    "mypy>=1.19.1",
    "pytest>=9.0.2",
    "pytest-asyncio>=1.3.0",
    "pytest-cov>=7.0.0",
    "pytest-xdist>=3.8.0",
]

[project.scripts]
lennoxs30ctl = "lennoxs30ctl.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/lennoxs30ctl"]

[tool.ruff]
line-length = 88
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "TCH"]

[tool.mypy]
strict = true

# lennoxs30api ships no py.typed marker, so everything it exports is Any.
# connection.py and format.py are the only modules allowed to touch it.
[[tool.mypy.overrides]]
module = "lennoxs30api.*"
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
filterwarnings = ["error::RuntimeWarning"]

[tool.coverage.run]
source = ["src/lennoxs30ctl"]

[dependency-groups]
dev = [
    "pre-commit>=4.5.1",
]
